<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galerie - Roter Panda</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        .gallery-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        .gallery-title {
            text-align: center;
            font-size: 2rem;
            color: #c85028;
            margin-bottom: 30px;
        }
        .video-section {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .video-section h2 {
            color: #c85028;
            margin-top: 0;
        }
        video {
            width: 100%;
            max-width: 600px;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .gallery-item {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .gallery-item:hover {
            transform: scale(1.05);
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <header class="w3-container w3-green">
        <h1 class="w3-xxxlarge">🖼️ Galerie</h1>
    </header>

    <nav class="w3-bar w3-border w3-light-grey w3-large">
        <a href="../index.html" class="w3-bar-item w3-button w3-border-right">Home</a>
        <a href="facts.html" class="w3-bar-item w3-button w3-border-right">Facts</a>
        <a href="Steckbrief.html" class="w3-bar-item w3-button w3-border-right">Steckbrief</a>
        <a href="gallerie.html" class="w3-bar-item w3-button w3-border-right w3-green">Gallerie</a>
    </nav>

    <div class="gallery-container">
        <div class="gallery-title">📸 Rote Pandas - Galerie</div>

        <!-- Video Section -->
        <div class="video-section">
            <h2>🎥 Video - Roter Panda</h2>
            <video controls width="600">
                <source src="../media/panda-video.mp4" type="video/mp4">
                Dein Browser unterstützt das Video-Tag nicht.
            </video>
            <p style="text-align: center; color: #666; margin-top: 10px;">
                Ersetze "panda-video.mp4" mit deinem eigenen Video-File im /media/ Ordner
            </p>
        </div>

        <!-- Image Gallery -->
        <h2 style="color: #c85028;">📷 Bildergalerie</h2>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="../img/panda1.jpg" alt="Roter Panda 1">
            </div>
            <div class="gallery-item">
                <img src="../img/panda2.jpg" alt="Roter Panda 2">
            </div>
            <div class="gallery-item">
                <img src="../img/panda3.jpg" alt="Roter Panda 3">
            </div>
            <div class="gallery-item">
                <img src="../img/panda4.jpg" alt="Roter Panda 4">
            </div>
            <div class="gallery-item">
                <img src="../img/panda5.jpg" alt="Roter Panda 5">
            </div>
            <div class="gallery-item">
                <img src="../img/panda6.jpg" alt="Roter Panda 6">
            </div>
        </div>
    </div>

    <footer class="w3-container w3-light-blue">
        <p>Dies ist mein Footer</p>
    </footer>

</body>
</html>
